<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק טריוויה - פלאש 🎬</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.3em;
            opacity: 0.9;
        }
        
        .score-board {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
        }
        
        .score-item {
            text-align: center;
        }
        
        .score-number {
            font-size: 2em;
            font-weight: bold;
        }
        
        .score-label {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .start-screen, .game-screen, .end-screen {
            padding: 50px 40px;
        }
        
        .start-screen {
            text-align: center;
        }
        
        .start-screen h2 {
            font-size: 2.5em;
            color: #1e3c72;
            margin-bottom: 20px;
        }
        
        .start-screen p {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 40px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Rubik', sans-serif;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .question-box {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border-right: 8px solid #667eea;
        }
        
        .question-number {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .question-text {
            font-size: 1.8em;
            color: #1e3c72;
            font-weight: bold;
            line-height: 1.5;
        }
        
        .answers-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .answer-btn {
            background: white;
            border: 3px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            font-size: 1.3em;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Rubik', sans-serif;
            font-weight: 500;
            color: #333;
        }
        
        .answer-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(-5px);
        }
        
        .answer-btn.correct {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border-color: #28a745;
            animation: correct-pulse 0.5s ease;
        }
        
        .answer-btn.wrong {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border-color: #dc3545;
            animation: wrong-shake 0.5s ease;
        }
        
        .answer-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        @keyframes correct-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes wrong-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .feedback {
            background: #fff3cd;
            border: 3px solid #ffc107;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 1.2em;
            display: none;
        }
        
        .feedback.show {
            display: block;
            animation: slide-in 0.3s ease;
        }
        
        @keyframes slide-in {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .next-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            display: none;
            font-family: 'Rubik', sans-serif;
            transition: transform 0.3s ease;
        }
        
        .next-btn.show {
            display: inline-block;
        }
        
        .next-btn:hover {
            transform: scale(1.05);
        }
        
        .end-screen {
            text-align: center;
        }
        
        .end-screen h2 {
            font-size: 3em;
            color: #1e3c72;
            margin-bottom: 20px;
        }
        
        .final-score {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 40px;
            border-radius: 20px;
            margin: 30px 0;
        }
        
        .final-score-number {
            font-size: 5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .final-score-text {
            font-size: 1.5em;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Rubik', sans-serif;
            transition: transform 0.3s ease;
        }
        
        .restart-btn:hover {
            transform: translateY(-5px);
        }
        
        .hidden {
            display: none;
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.2);
            height: 10px;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: #ffd700;
            height: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 משחק טריוויה 🎮</h1>
            <p>תוכנית פלאש - סטוריטלינג וקולנוע</p>
            
            <div class="score-board" id="scoreBoard" style="display: none;">
                <div class="score-item">
                    <div class="score-number" id="currentQuestion">1</div>
                    <div class="score-label">שאלה</div>
                </div>
                <div class="score-item">
                    <div class="score-number" id="score">0</div>
                    <div class="score-label">ניקוד</div>
                </div>
                <div class="score-item">
                    <div class="score-number" id="streak">0</div>
                    <div class="score-label">רצף 🔥</div>
                </div>
            </div>
            
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h2>🎬 מוכנים למבחן? 🎬</h2>
            <p>בואו נבדוק כמה אתם יודעים!</p>
            <p style="font-size: 1.1em; color: #999; margin-bottom: 40px;">20 שאלות על כל החומר שלמדנו</p>
            <button class="btn" onclick="startGame()">בואו נתחיל! 🚀</button>
        </div>
        
        <!-- Game Screen -->
        <div class="game-screen hidden" id="gameScreen">
            <div class="question-box">
                <div class="question-number" id="questionNumber">שאלה 1 מתוך 20</div>
                <div class="question-text" id="questionText"></div>
            </div>
            
            <div class="answers-grid" id="answersGrid"></div>
            
            <div class="feedback" id="feedback"></div>
            
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">שאלה הבאה ➡️</button>
        </div>
        
        <!-- End Screen -->
        <div class="end-screen hidden" id="endScreen">
            <h2>🎉 סיימתם! 🎉</h2>
            
            <div class="final-score">
                <div class="final-score-number" id="finalScore">0</div>
                <div class="final-score-text">נקודות מתוך 100</div>
            </div>
            
            <p id="finalMessage" style="font-size: 1.5em; color: #666; margin-bottom: 30px;"></p>
            
            <button class="restart-btn" onclick="restartGame()">שחקו שוב! 🔄</button>
        </div>
    </div>
    
    <script>
        const questions = [
            {
                question: "כמה גדלי שוטים עיקריים יש?",
                answers: ["2", "3", "4", "5"],
                correct: 1,
                explanation: "יש 3 גדלי שוטים: Close Up, Medium Shot, Long Shot"
            },
            {
                question: "מה זה Close Up?",
                answers: ["פרצוף מקרוב - רואים רגשות", "הדמות כולה והסביבה", "מהמותניים למעלה", "צילום מלמעלה"],
                correct: 0,
                explanation: "Close Up = תקריב - פרצוף מקרוב, רואים רגשות!"
            },
            {
                question: "כמה סוגי צלילים יש בסרט?",
                answers: ["2", "3", "4", "5"],
                correct: 1,
                explanation: "יש 3 סוגים: דיבורים, אפקטים (צלילים), ומוזיקת רקע"
            },
            {
                question: "האם לקולנוע תיעודי יש תסריט?",
                answers: ["כן, יש תסריט", "לא, זה הכל ספונטני", "רק לפעמים", "תלוי בבמאי"],
                correct: 0,
                explanation: "כן! גם לקולנוע תיעודי יש תסריט - זה לא הכי אמיתי בוודאות!"
            },
            {
                question: "איך קראו לקומדיות הישראליות ששברו שיאים בשנות ה-60-70?",
                answers: ["סרטי חומוס", "סרטי בורקס", "סרטי פלאפל", "סרטי שקשוקה"],
                correct: 1,
                explanation: "סרטי בורקס! נקראו ככה כי התמקדו בהבדלים בין עדות"
            },
            {
                question: "מה זה ז'אנר?",
                answers: ["במאי מפורסם", "סוג של סרט", "טכניקת צילום", "שחקן ראשי"],
                correct: 1,
                explanation: "ז'אנר = סוג של סרט (כמו קומדיה, אימה, מדע בדיוני)"
            },
            {
                question: "מתי יצא הסרט המדע בדיוני הראשון 'מסע לירח'?",
                answers: ["1895", "1902", "1927", "1950"],
                correct: 1,
                explanation: "1902! של הבמאי ג'ורג' מלייס - טיל פוגע בעין של הירח"
            },
            {
                question: "מה הדבר הכי חשוב בסיפור?",
                answers: ["התסריט", "האפקטים המיוחדים", "הדמות", "המוזיקה"],
                correct: 2,
                explanation: "הדמות! דמות טובה היא הדבר הכי חשוב בסיפור"
            },
            {
                question: "איך יוצרים דמות שמזדהים איתה?",
                answers: ["מושלמת ללא פגמים", "אנושית עם פגמים וסתירות", "רק חזקה", "רק חלשה"],
                correct: 1,
                explanation: "דמות צריכה להיות אנושית, ספציפית, עם פגמים וסתירות - ככה היא מעניינת!"
            },
            {
                question: "מה זה אנטי-גיבור?",
                answers: ["נבל רגיל", "גיבור שעושה דברים לא מוסריים", "גיבור מושלם", "דמות משנית"],
                correct: 1,
                explanation: "אנטי-גיבור = גיבור שעושה דברים לא מוסריים, אבל אנחנו עדיין משתתפים איתו!"
            },
            {
                question: "איזו מהדמויות האלה היא אנטי-גיבור?",
                answers: ["סופרמן", "ונום", "באגס באני", "שרק"],
                correct: 1,
                explanation: "ונום! הוא חייזר שאוכל אנשים אבל גם מציל אותם - קלאסי אנטי-גיבור"
            },
            {
                question: "מה הופך נבל למושלם?",
                answers: ["הוא חזק מאוד", "הוא חושב שהוא צודק", "הוא רע מאוד", "הוא מצחיק"],
                correct: 1,
                explanation: "נבל שחושב שהוא הגיבור = נבל מעולה! יש לו מוטיבציה ועבר"
            },
            {
                question: "איזה נבל חושב שהוא מציל את היקום?",
                answers: ["ג'וקר", "טאנוס", "דארת' ויידר", "וולדמורט"],
                correct: 1,
                explanation: "טאנוס! הוא חושב שהוא מציל את היקום - נבל מושלם"
            },
            {
                question: "מה זה קונפליקט פנימי?",
                answers: ["מלחמה בין מדינות", "הגיבור נלחם עם עצמו", "קרב עם נבל", "ריב עם חבר"],
                correct: 1,
                explanation: "קונפליקט פנימי = הגיבור נלחם עם עצמו (פחד, אשמה, ספק עצמי)"
            },
            {
                question: "למה קונפליקט פנימי חשוב?",
                answers: ["זה הופך את הסיפור לעמוק", "זה יותר זול לצלם", "זה יותר מצחיק", "זה יותר מפחיד"],
                correct: 0,
                explanation: "קונפליקט פנימי הופך את הסיפור לעמוק וגורם לנו להזדהות!"
            },
            {
                question: "מה העיקרון הראשון של משחק טוב?",
                answers: ["יקר לקנות", "קשה ללמוד", "קל ללמוד, קשה לשלוט", "הרבה פרסומות"],
                correct: 2,
                explanation: "קל ללמוד, קשה לשלוט - תוך 5 שניות מבין, אבל לשלוט לוקח שנים!"
            },
            {
                question: "מה זה Loop ממכר במשחק?",
                answers: ["מעגל שחוזר ומושך אותך", "באג במשחק", "שלב קשה", "רמה אחרונה"],
                correct: 0,
                explanation: "Loop ממכר = מעגל שחוזר ומושך אותך לשחק עוד ועוד!"
            },
            {
                question: "איזה משחק הוא דוגמה ליצירתיות וחופש?",
                answers: ["Pac-Man", "Pong", "Minecraft", "Tetris"],
                correct: 2,
                explanation: "Minecraft! תבנה מה שאתה רוצה - אין דרך נכונה לשחק"
            },
            {
                question: "מה הופך משחק לאומנות?",
                answers: ["גרפיקה טובה בלבד", "קשר רגשי, עולמות, בחירה", "הרבה שחקנים", "מחיר גבוה"],
                correct: 1,
                explanation: "משחקים הם אומנות כי יש להם קשר רגשי, בניית עולמות, ובחירת שחקן!"
            },
            {
                question: "באיזה סרט ג'וקר מנסה להוכיח שכולם רעים בפנים?",
                answers: ["Batman Begins", "The Dark Knight", "Joker (2019)", "Batman Forever"],
                correct: 1,
                explanation: "The Dark Knight! הג'וקר של הית' לדג'ר - נבל מושלם"
            }
        ];
        
        let currentQuestionIndex = 0;
        let score = 0;
        let streak = 0;
        let answeredQuestions = 0;
        
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('scoreBoard').style.display = 'flex';
            document.getElementById('progressBar').style.display = 'block';
            
            currentQuestionIndex = 0;
            score = 0;
            streak = 0;
            answeredQuestions = 0;
            
            showQuestion();
        }
        
        function showQuestion() {
            const question = questions[currentQuestionIndex];
            
            document.getElementById('questionNumber').textContent = `שאלה ${currentQuestionIndex + 1} מתוך ${questions.length}`;
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            
            const answersGrid = document.getElementById('answersGrid');
            answersGrid.innerHTML = '';
            
            question.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = answer;
                btn.onclick = () => checkAnswer(index);
                answersGrid.appendChild(btn);
            });
            
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('nextBtn').classList.remove('show');
            
            // Update progress bar
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        function checkAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const buttons = document.querySelectorAll('.answer-btn');
            const feedback = document.getElementById('feedback');
            
            // Disable all buttons
            buttons.forEach(btn => btn.classList.add('disabled'));
            
            if (selectedIndex === question.correct) {
                buttons[selectedIndex].classList.add('correct');
                score += 5;
                streak++;
                
                feedback.innerHTML = `<strong>✅ נכון!</strong><br>${question.explanation}`;
                feedback.style.background = '#d4edda';
                feedback.style.borderColor = '#28a745';
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[question.correct].classList.add('correct');
                streak = 0;
                
                feedback.innerHTML = `<strong>❌ לא נכון...</strong><br>${question.explanation}`;
                feedback.style.background = '#f8d7da';
                feedback.style.borderColor = '#dc3545';
            }
            
            feedback.classList.add('show');
            document.getElementById('nextBtn').classList.add('show');
            
            // Update score display
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            
            answeredQuestions++;
        }
        
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                endGame();
            }
        }
        
        function endGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            document.getElementById('scoreBoard').style.display = 'none';
            document.getElementById('progressBar').style.display = 'none';
            
            const finalScore = score;
            const maxScore = questions.length * 5;
            const percentage = (finalScore / maxScore) * 100;
            
            document.getElementById('finalScore').textContent = finalScore;
            
            let message = '';
            if (percentage === 100) {
                message = '🏆 מושלם! אתם מלכי הקולנוע! 🏆';
            } else if (percentage >= 80) {
                message = '🌟 מעולה! אתם ממש מוכנים למבחן! 🌟';
            } else if (percentage >= 60) {
                message = '👍 טוב מאוד! עוד קצת לימוד ואתם שם! 👍';
            } else if (percentage >= 40) {
                message = '📚 לא רע! תחזרו על החומר ותהיו מעולים! 📚';
            } else {
                message = '💪 כדאי לחזור על החומר - אתם יכולים! 💪';
            }
            
            document.getElementById('finalMessage').textContent = message;
        }
        
        function restartGame() {
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
